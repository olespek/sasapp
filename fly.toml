# Oppsett for Fly.io. Se DRIFT.md.
# Bytt «app» til et ledig navn før første `fly launch` / `fly deploy`.
app = "sola-airshow-arenaplan"
primary_region = "arn" # Stockholm

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DATABASE_PATH = "/data/sasapp.db"

# Varig lagring for databasen. Fly tar daglige øyeblikksbilder av volumet.
[[mounts]]
  source = "sasapp_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
